<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Todo_list</title>
</head>
<body>
      <div id="main_div">
    <div class="head">
        <h1>To-Do List 📝</h1>
    </div>

    <div class="todo_list">
        <input id="input" type="text" placeholder="Add Your Task">
        <button onclick="todoapp.additem()" class="add_task">Add</button>
    </div>

    <div class="mylist">
        <ul id="list"></ul>
    </div>
</div>
<script>
    let input = document.getElementById("input");
let todolist = document.getElementById("list");

let list = [];

let todoapp = {
    additem() {
        if (input.value.trim() !== "") {
            list.push(input.value);
            input.value = "";
            this.render();
        }
    },

    render() {
        todolist.innerHTML = "";

        list.forEach((value, index) => {
            todolist.innerHTML += `
                <li onclick="todoapp.toggle(this)">
                    ${value}
                    <button class="delete_btn" onclick="event.stopPropagation(); todoapp.delete(${index})">X</button>
                </li>
            `;
        });
    },

    delete(index) {
        list.splice(index, 1);
        this.render();
    },

    toggle(element) {
        element.classList.toggle("checked");
    }
};

// Enter key support
input.addEventListener("keypress", function(e){
    if(e.key === "Enter"){
        todoapp.additem();
    }
});
</script>
</body>
</html>
